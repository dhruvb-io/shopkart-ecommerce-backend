name: Deploy to AWS

on:
  workflow_dispatch

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Restart application
        run: |
          if pm2 describe server > /dev/null 2>&1; then
            pm2 restart server
          else
            pm2 start src/index.js --name server
          fi
          pm2 save